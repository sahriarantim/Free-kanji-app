<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moji Free | JLPT Kanji Flashcards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: var(--accent); font-size: 1.8rem; letter-spacing: 1px; }
        header p { color: #94a3b8; font-size: 0.85rem; }

        /* Level Selector */
        .filter-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .filter-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--accent); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .filter-btn.active { background: var(--accent); color: #000; }

        /* Flashcard Main UI */
        .card-container { perspective: 1000px; width: 100%; max-width: 350px; height: 420px; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; background: var(--card-bg); border: 2px solid rgba(56, 189, 248, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card-back { transform: rotateY(180deg); text-align: center; }

        .kanji-text { font-size: 110px; font-weight: bold; color: #fff; text-shadow: 0 0 20px var(--accent); }
        .level-badge { position: absolute; top: 15px; right: 20px; background: var(--accent); color: black; padding: 4px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; }
        
        .meaning-title { font-size: 1.5rem; color: var(--accent); margin-bottom: 10px; }
        .reading-box { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; width: 100%; margin: 8px 0; text-align: left; }
        .reading-box strong { color: #f59e0b; }

        /* Controls */
        .controls { display: flex; gap: 20px; margin-top: 25px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 1rem; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }

        footer { margin-top: auto; padding: 20px; font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-book-open"></i> Moji Free</h1>
        <p>JLPT Kanji Flashcards & Practice</p>
    </header>

    <!-- Filter Buttons -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterLevel('ALL')">ALL</button>
        <button class="filter-btn" onclick="filterLevel('N5')">N5</button>
        <button class="filter-btn" onclick="filterLevel('N4')">N4</button>
    </div>

    <!-- Flashcard -->
    <div class="card-container">
        <div class="card" id="flashcard" onclick="flipCard()">
            <!-- Front Face -->
            <div class="card-face card-front">
                <span class="level-badge" id="card-level">N5</span>
                <div class="kanji-text" id="card-kanji">日</div>
                <p style="color: #64748b; font-size: 0.85rem;"><i class="fas fa-sync-alt"></i> Tap to Flip</p>
            </div>
            <!-- Back Face -->
            <div class="card-face card-back">
                <h2 class="meaning-title" id="card-meaning">Sun / Day</h2>
                <div class="reading-box">
                    <strong>Onyomi:</strong> <span id="card-onyomi">NICHI, JITSU</span>
                </div>
                <div class="reading-box">
                    <strong>Kunyomi:</strong> <span id="card-kunyomi">hi, -bi</span>
                </div>
                <div class="reading-box">
                    <strong>Example:</strong> <span id="card-example">日本 (Nihon - Japan)</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Buttons -->
    <div class="controls">
        <button class="btn" onclick="speakKanji()"><i class="fas fa-volume-high"></i> Pronounce</button>
        <button class="btn" onclick="nextCard()"><i class="fas fa-forward"></i> Next</button>
    </div>

    <footer>
        Developed by Sahriar Antim • 100% Free JLPT Learning
    </footer>

    <script>
        // Kanji Database (Apni iccha moto aro hajaro Kanji add korte parben)
        const kanjiDatabase = [
            { kanji: "日", meaning: "Sun / Day (দিন/সূর্য)", onyomi: "NICHI, JITSU", kunyomi: "hi, -bi", example: "日本 (Nihon)", level: "N5" },
            { kanji: "月", meaning: "Moon / Month (চাঁদ/মাস)", onyomi: "GETSU, GATSU", kunyomi: "tsuki", example: "一月 (Ichigatsu)", level: "N5" },
            { kanji: "火", meaning: "Fire (আগুন)", onyomi: "KA", kunyomi: "hi", example: "火曜日 (Kayoubi)", level: "N5" },
            { kanji: "水", meaning: "Water (পানি)", onyomi: "SUI", kunyomi: "mizu", example: "水曜日 (Suiyoubi)", level: "N5" },
            { kanji: "木", meaning: "Tree / Wood (গাছ)", onyomi: "MOKU, BOKU", kunyomi: "ki", example: "木曜日 (Mokuyoubi)", level: "N4" },
            { kanji: "金", meaning: "Gold / Money (টাকা/সোনা)", onyomi: "KIN", kunyomi: "kane", example: "お金 (Okane)", level: "N4" }
        ];

        let currentList = [...kanjiDatabase];
        let currentIndex = 0;

        function updateCard() {
            const data = currentList[currentIndex];
            document.getElementById('card-kanji').innerText = data.kanji;
            document.getElementById('card-meaning').innerText = data.meaning;
            document.getElementById('card-onyomi').innerText = data.onyomi;
            document.getElementById('card-kunyomi').innerText = data.kunyomi;
            document.getElementById('card-example').innerText = data.example;
            document.getElementById('card-level').innerText = data.level;
            
            // Reset Flip state
            document.getElementById('flashcard').classList.remove('flipped');
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % currentList.length;
            updateCard();
        }

        function filterLevel(level) {
            // Update Active button UI
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(level === 'ALL') {
                currentList = [...kanjiDatabase];
            } else {
                currentList = kanjiDatabase.filter(item => item.level === level);
            }
            currentIndex = 0;
            if(currentList.length > 0) updateCard();
        }

        // Japanese Voice Pronunciation
        function speakKanji() {
            const currentData = currentList[currentIndex];
            const utterance = new SpeechSynthesisUtterance(currentData.kanji);
            utterance.lang = 'ja-JP';
            speechSynthesis.speak(utterance);
        }

        // Initialize
        updateCard();
    </script>
</body>
</html>
